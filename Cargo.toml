
# ##########################################################
# Package

[package]

authors = [
	"Matt Wilson <matthew@synesis.com.au>",
]
categories = [
	"config",
	"encoding",
	"no-std",
	"parsing",
	"text-processing",
]
description = "Simple library determining whether strings indicate truey or falsey values (for Rust)"
documentation = "https://docs.rs/to-be"
edition = "2021"
exclude = [
	".cargo",
	".cursor",
	".github",
	".vimrc",
	".vscode",
	"scripts",
	"target",
]
homepage = "https://github.com/synesissoftware/to-be.Rust"
keywords = [
	"configuration",
	"environment",
	"string",
	"traits",
]
license = "BSD-3-Clause"
name = "to-be"
readme = "README.md"
repository = "https://github.com/synesissoftware/to-be.Rust"
rust-version = "1.74"
version = "0.0.10"

# docs.rs builds the complete concrete-type API; the AsStr implementation
# cannot be combined with the concrete-type implementation features.

[package.metadata.docs.rs]
features = [
	"implement-Truthy-for-most",
]


# ##########################################################
# Targets

[lib]
name = "to_be"
path = "src/lib.rs"

[[bench]]
name = "string_truthy"
harness = false

[[example]]
name = "truthy_strings"
path = "examples/truthy_strings.rs"
required-features = [
	"implement-Truthy-for-str",
]

[[example]]
name = "versions"
path = "examples/versions/main.rs"


# ##########################################################
# Features

[features]

default = [
	"implement-Truthy-for-bool",
	"implement-Truthy-for-str",
	"implement-Truthy-for-String",
]


# General features:
#
# - "_NEVER_TO_BE_ENABLED" - this is a placeholder feature and must NEVER be specified;
# - "null-feature" - a feature that has no effect (and, thus, is useful for simplifying driver scripts);

_NEVER_TO_BE_ENABLED = []
null-feature = []


# Crate-specific features:
#
# - "implement-Truthy-for-AsStr" - implements `Truthy` for all types that implement `AsStr`. NOTE: this is incompatible with the other features that pertain to concrete types;
# - "implement-Truthy-for-CStr" - implements `Truthy` for `CStr` type;
# - "implement-Truthy-for-CString" - implements `Truthy` for `CString` type;
# - "implement-Truthy-for-OsStr" - implements `Truthy` for `OsStr` type;
# - "implement-Truthy-for-OsString" - implements `Truthy` for `OsString` type;
# - "implement-Truthy-for-String" - implements `Truthy` for `String` type;
# - "implement-Truthy-for-bool" - implements `Truthy` for `bool` type;
# - "implement-Truthy-for-most" - implements `Truthy` for the common concrete types (bool, CStr, CString, OsStr, OsString, str, String);
# - "implement-Truthy-for-str" - implements `Truthy` for `&str` type;

implement-Truthy-for-most = [
	"implement-Truthy-for-bool",
	"implement-Truthy-for-CStr",
	"implement-Truthy-for-CString",
	"implement-Truthy-for-OsStr",
	"implement-Truthy-for-OsString",
	"implement-Truthy-for-str",
	"implement-Truthy-for-String",
]

implement-Truthy-for-AsStr = [
]
implement-Truthy-for-bool = [
]
implement-Truthy-for-CStr = [
]
implement-Truthy-for-CString = [
]
implement-Truthy-for-OsStr = [
]
implement-Truthy-for-OsString = [
]
implement-Truthy-for-str = [
]
implement-Truthy-for-String = [
]
# ##########################################################
# Dependencies

[build-dependencies]

[dependencies]

base-traits = { version = "0.1", default-features = false, features = [
	"implement-AsStr-for-built_ins",
]}


[dev-dependencies]

criterion = { version = "0.8", default-features = false, features = [
	"plotters",
] }


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
